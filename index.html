<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STARS Operational Rota Dashboard</title>
    <style>
        :root { --primary: #0056b3; --success: #28a745; --dark: #343a40; --light: #f8f9fa; --border: #dee2e6; }
        body { font-family: sans-serif; margin: 0; padding: 20px; background-color: var(--light); }
        header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .grid-container { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        .panel { background: white; padding: 20px; border-radius: 6px; border: 1px solid var(--border); }
        .btn-compile { background-color: #ffc107; border: none; padding: 10px; cursor: pointer; border-radius: 4px; }
        .form-group { margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        .registry-list { max-height: 250px; overflow-y: auto; border: 1px solid var(--border); padding: 10px; }
        .person-card { background: #fff; padding: 8px; margin-bottom: 8px; border-left: 4px solid var(--primary); display: flex; justify-content: space-between; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 2px 6px; cursor: pointer; }
        .output-matrix { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .output-matrix th, .output-matrix td { border: 1px solid var(--border); padding: 10px; text-align: left; }
    </style>
</head>
<body>
    <header><h2>STARS Operational Rota Dashboard</h2><button id="compileBtn" class="btn-compile">⚡ Compile</button></header>
    <div class="grid-container">
        <div class="panel">
            <h3>Register Personnel</h3>
            <div class="form-group"><input type="text" id="fullName" placeholder="Full Name"></div>
            <div class="form-group"><select id="mandatoryReq"><option>Anytime</option><option>Mornings</option><option>Lates</option></select></div>
            <div class="form-group"><button id="addProfileBtn" style="background:var(--primary);color:white;border:none;padding:10px;width:100%;">Add</button></div>
            <div id="registryList" class="registry-list"></div>
        </div>
        <div class="panel">
            <h3>Absences</h3>
            <textarea id="absenceInput" placeholder="One name per line"></textarea>
            <div id="matrixTableWrapper"></div>
        </div>
    </div>
    <script>
        let rosterPersonnel = [];
        document.getElementById('addProfileBtn').addEventListener('click', () => {
            const name = document.getElementById('fullName').value;
            if(name) {
                rosterPersonnel.push({id: Date.now(), name, mandatory: document.getElementById('mandatoryReq').value});
                updateUI();
                document.getElementById('fullName').value = '';
            }
        });
        document.getElementById('compileBtn').addEventListener('click', compileRota);
        function updateUI() {
            const list = document.getElementById('registryList');
            list.innerHTML = '';
            rosterPersonnel.forEach(p => {
                list.innerHTML += `<div class="person-card"><span>${p.name}</span><button class="btn-delete" onclick="deleteP(${p.id})">X</button></div>`;
            });
        }
        function deleteP(id) {
            rosterPersonnel = rosterPersonnel.filter(p => p.id !== id);
            updateUI();
        }
        function compileRota() {
            const abs = document.getElementById('absenceInput').value.split('\n');
            const available = rosterPersonnel.filter(p => !abs.includes(p.name));
            let table = '<table class="output-matrix"><tr><th>Ops</th><th>Lates</th></tr>';
            available.forEach(p => table += `<tr><td>${p.name}</td><td>${p.mandatory}</td></tr>`);
            document.getElementById('matrixTableWrapper').innerHTML = table + '</table>';
        }
    </script>
</body>
</html>
